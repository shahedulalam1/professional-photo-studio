<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>প্রিন্ট ফরম</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f0f2f5;--card:#fff;--tx:#1a1d21;--mu:#6b7280;--ac:#0d8a55;--ac2:#fff;--bd:#e5e7eb;--bd2:#d1d5db;--soft:#f8fafc;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1215;--card:#1a1f24;--tx:#eef1f4;--mu:#9aa3ad;--ac:#2fb87a;--ac2:#06150e;--bd:#2a323a;--bd2:#3a4450;--soft:#151a1f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1215;--card:#1a1f24;--tx:#eef1f4;--mu:#9aa3ad;--ac:#2fb87a;--ac2:#06150e;--bd:#2a323a;--bd2:#3a4450;--soft:#151a1f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.ui{max-width:760px;margin:0 auto;padding:14px 14px 20px}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 0 12px}
.hdr-left{min-width:0}
.hdr-right{text-align:right;flex-shrink:0;font-size:12px;line-height:1.45;color:var(--mu);padding-top:2px}
.hdr-right b{display:block;color:var(--tx);font-size:13px;font-weight:700}
h1{font-size:20px;margin:0;font-weight:700}
.tabs{display:flex;gap:4px;margin-bottom:14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tabs button{flex:1;padding:11px 6px;border:0;background:transparent;color:var(--mu);border-radius:10px;font:inherit;font-weight:600;font-size:13px;line-height:1.25;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s}
.tabs button.on{background:var(--ac);color:var(--ac2);box-shadow:0 2px 8px rgba(13,138,85,.28)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.box>b,.box>.sec-title{display:block;font-size:15px;font-weight:700;margin-bottom:10px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1;min-width:140px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:5px;font-weight:500}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;z-index:-1}
select,input[type=number]{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--soft);color:var(--tx);font:inherit;font-size:14px;transition:border-color .15s}
select:focus,input[type=number]:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(13,138,85,.15)}
input[type=range]{width:100%;accent-color:var(--ac)}
button.b{padding:9px 14px;border:1px solid var(--bd);background:var(--soft);color:var(--tx);border-radius:10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s}
button.b:hover{background:var(--bd);border-color:var(--bd2)}
button.p{width:100%;padding:14px;border:0;background:var(--ac);color:var(--ac2);border-radius:12px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(13,138,85,.25)}
button.p:hover{filter:brightness(1.05)}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--tx);font-size:14px}
.hint{font-size:12px;color:var(--mu);margin:6px 0 0;line-height:1.5}
.upload-zone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:22px 14px;border:2px dashed var(--bd2);border-radius:14px;background:var(--soft);cursor:pointer;text-align:center;transition:border-color .15s,background .15s;min-height:88px;position:relative}
.upload-zone:hover,.upload-zone:focus-within{border-color:var(--ac);background:rgba(13,138,85,.04)}
.upload-zone .uz-icon{font-size:26px;line-height:1;opacity:.9}
.upload-zone .uz-text{font-size:13px;font-weight:600;color:var(--tx)}
.upload-zone .uz-sub{font-size:11px;color:var(--mu)}
.upload-zone input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:2}
.btn-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn-row .b{flex:1;min-width:90px;text-align:center}
.bg-swatches{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 4px;align-items:center}
.bg-sw{width:40px;height:40px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.12);transition:transform .12s,box-shadow .12s;position:relative;flex-shrink:0;background:transparent}
.bg-sw:hover{transform:scale(1.08)}
.bg-sw.on{box-shadow:0 0 0 3px var(--ac);border-color:rgba(255,255,255,.5)}
.bg-sw .bg-orig{display:block;width:100%;height:100%;border-radius:50%;background:conic-gradient(#e5e7eb 0 25%,#fff 0 50%,#e5e7eb 0 75%,#fff 0);background-size:50% 50%}
.bg-custom{display:flex;align-items:center;justify-content:center;background:var(--soft);border:2px dashed var(--bd2)!important;box-shadow:none;font-size:18px;font-weight:700;color:var(--mu);overflow:hidden}
.bg-custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.bg-custom span{pointer-events:none}
#wrap{margin:0 auto;overflow:hidden}
#sheet{width:210mm;height:297mm;background:#fff;color:#000;position:relative;transform-origin:top left;box-shadow:0 1px 8px rgba(0,0,0,.3);overflow:hidden}
.ph{border:1px dashed #999;color:#888;display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center}
.cd{display:block;object-fit:contain;background:#fff}
.pp{overflow:hidden;background:#fff;position:relative}
.pp img{width:100%;height:100%;object-fit:cover;display:block}
.pp .safe{position:absolute;left:12%;right:12%;top:8%;height:62%;border:1.5px dashed rgba(47,184,122,.85);border-radius:50% 50% 45% 45%;pointer-events:none;box-shadow:0 0 0 1px rgba(255,255,255,.4);opacity:.9}
.pp .safe::after{content:"মুখ এখানে";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:9px;color:rgba(47,184,122,.95);background:rgba(255,255,255,.75);padding:1px 4px;border-radius:3px;white-space:nowrap;font-weight:600}
#sheet.warn-border{outline:3px solid #e0613a;outline-offset:-3px}
#sheet .overflow-badge{position:absolute;top:6px;right:6px;background:#e0613a;color:#fff;font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;z-index:5;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.25)}
@media print{.pp .safe,#sheet.warn-border,#sheet .overflow-badge{display:none!important}}
#cs{position:relative;touch-action:none;flex:none;overflow:hidden;border-radius:6px}
#cb{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);touch-action:none;cursor:move}
#cb i{position:absolute;width:32px;height:32px;border:4px solid #2fb87a;background:rgba(47,184,122,.25)}
#cb i[data-h=tl]{left:0;top:0;border-right:0;border-bottom:0}
#cb i[data-h=tr]{right:0;top:0;border-left:0;border-bottom:0}
#cb i[data-h=bl]{left:0;bottom:0;border-right:0;border-top:0}
#cb i[data-h=br]{right:0;bottom:0;border-left:0;border-top:0}
#cm .row2{display:flex;gap:8px;width:100%;max-width:760px;align-items:center;flex-wrap:wrap}
@media print{#cm{display:none!important}}
@page{size:A4;margin:0}
@media print{
 html,body{background:#fff!important;padding:0!important}
 .ui{display:none!important}
 #wrap{height:297mm!important;width:210mm!important;overflow:visible!important}
 #sheet{transform:none!important;box-shadow:none!important}
 .noprint{display:none!important}
}
h1{font-size:21px;letter-spacing:.2px}
h1::after{content:"ছবি কেটে, ঠিক করে সরাসরি প্রিন্ট";display:block;font-size:12px;font-weight:400;color:var(--mu);margin-top:3px}
#sheet{border-radius:2px}
#cb{border-radius:2px}
:root{--ws:#dde1e6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ws:#0d1013}}
:root[data-theme="dark"]{--ws:#0d1013}
@media (min-width:900px){
 :root{padding:0}
 html,body{height:100%}
 body{display:grid;grid-template-columns:392px 1fr;height:100vh;overflow:hidden;background:var(--ws)}
 .ui{grid-column:1;grid-row:1;max-width:none;margin:0;height:100vh;overflow-y:auto;background:var(--bg);border-right:1px solid var(--bd);padding:16px 16px 12px}
 .tabs{position:sticky;top:0;z-index:5}
 .ui button.p{position:sticky;bottom:8px;z-index:5}
 #wrap{grid-column:2;grid-row:1;place-self:center;margin:0!important}
 #sheet{box-shadow:0 8px 32px rgba(0,0,0,.4)}
 #cm{grid-template-columns:1fr 340px;grid-auto-rows:min-content;align-content:start;align-items:start;column-gap:20px;padding:14px 22px!important}
 #cm>#ct{grid-column:1/-1;text-align:left!important}
 #cm>#cs{grid-column:1;grid-row:2/span 12;justify-self:center}
 #cm>*:not(#ct):not(#cs){grid-column:2;width:100%!important;max-width:none!important}
}
@media (pointer:fine){#cb i{width:22px;height:22px}#cq circle{r:11px}}
@media print{body{display:block!important;height:auto!important;overflow:visible!important;background:#fff!important}#wrap{margin:0!important}#pmd{display:none!important}#loading{display:none!important}}
#loading{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#fff;font-size:16px;font-weight:600;backdrop-filter:blur(3px)}
#loading.show{display:flex}
#loading .spin{width:42px;height:42px;border:4px solid rgba(255,255,255,.25);border-top-color:#2fb87a;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="ui">
<div class="hdr">
 <div class="hdr-left"><h1>🖨️ প্রিন্ট ফরম</h1></div>
 <div class="hdr-right"><b>ডিজাইন ও নকশা</b><br>শাহেদুল আলম<br>01846201292</div>
</div>
